services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: xueju
      MYSQL_USER: xueju
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_PORT: 8080
      MYSQL_DSN: xueju:${MYSQL_PASSWORD}@tcp(mysql:3306)/xueju?charset=utf8mb4&parseTime=True&loc=Local
      JWT_SECRET: ${JWT_SECRET}
      WECHAT_APP_ID: ${WECHAT_APP_ID}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET}
      CONTENT_SECURITY_ENABLED: "true"
      CONTENT_SECURITY_PROVIDER: wechat
      WECHAT_MEDIA_CALLBACK_TOKEN: ${WECHAT_MEDIA_CALLBACK_TOKEN}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      STORAGE_DRIVER: s3
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      ALIYUN_ACCESS_KEY_ID: ${ALIYUN_ACCESS_KEY_ID}
      ALIYUN_ACCESS_KEY_SECRET: ${ALIYUN_ACCESS_KEY_SECRET}
      ALIYUN_SMS_VERIFY_SIGN_NAME: ${ALIYUN_SMS_VERIFY_SIGN_NAME}
      ALIYUN_SMS_VERIFY_TEMPLATE_CODE: ${ALIYUN_SMS_VERIFY_TEMPLATE_CODE}
      ALIYUN_SMS_VERIFY_SCHEME_NAME: ${ALIYUN_SMS_VERIFY_SCHEME_NAME}
      PHONE_ENCRYPTION_KEY: ${PHONE_ENCRYPTION_KEY}
      PHONE_HASH_SECRET: ${PHONE_HASH_SECRET}
      SMS_CODE_EXPIRE_SECONDS: ${SMS_CODE_EXPIRE_SECONDS:-300}
      SMS_SEND_INTERVAL_SECONDS: ${SMS_SEND_INTERVAL_SECONDS:-60}
      SMS_DAILY_LIMIT_PER_PHONE: ${SMS_DAILY_LIMIT_PER_PHONE:-10}
      SMS_DAILY_LIMIT_PER_USER: ${SMS_DAILY_LIMIT_PER_USER:-10}
      SMS_HOURLY_LIMIT_PER_IP: ${SMS_HOURLY_LIMIT_PER_IP:-30}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  admin:
    build: ./admin
    restart: unless-stopped
    depends_on: [backend]
    ports: ["8081:80"]

volumes:
  mysql-data:
