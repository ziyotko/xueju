server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:8080/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
  }

  location /uploads/ {
    proxy_pass http://backend:8080/uploads/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /admin { return 301 /admin/; }

  # The browser keeps the /admin/ prefix, while files remain in the image's
  # document root. Every client-side route falls back to the SPA entry point.
  location /admin/ {
    rewrite ^/admin/(.*)$ /$1 break;
    try_files $uri $uri/ /index.html;
  }

  # Also supports an upstream proxy that strips /admin/ before forwarding.
  location / { try_files $uri $uri/ /index.html; }
}
